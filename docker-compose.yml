services:
  postgres:
    image: postgres:18 
    environment:
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: playground
      POSTGRES_DB: playground 
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql 
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U playground -d playground"]
      interval: 3s 
      timeout: 3s 
      retries: 20 
volumes:
  pgdata:
